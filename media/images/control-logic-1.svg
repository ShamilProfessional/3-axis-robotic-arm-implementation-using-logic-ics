<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Motor direction control logic</title>
  <desc id="desc">Forward and reverse controls are interlocked, then combined with the inverted 555 clock to generate the CPU and CPD counter clock signals.</desc>
  <rect width="1080" height="380" fill="#fff"/>
  <g fill="none" stroke="#8abf62" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- inputs and forward/reverse interlock wiring -->
    <path d="M28 178H90 M28 220H90 M28 262H90"/>
    <path d="M90 178V100H235 M90 178V262H235"/>
    <path d="M90 220H120V124H235 M90 220V302H235"/>
    <path d="M90 262V302"/>
    <!-- enables to clock gates -->
    <path d="M335 112H580V120H650 M335 292H580V250H650"/>
    <!-- clock inverter and shared inverted clock -->
    <path d="M195 178H255 M305 178H455V120H650 M455 178V250H650"/>
    <!-- gated clock outputs -->
    <path d="M750 120H815 M865 120H930 M750 250H815 M865 250H930"/>
    <!-- junctions -->
    <path d="M90 178h1 M90 220h1 M90 262h1 M455 178h1"/>
  </g>
  <g fill="#8abf62">
    <circle cx="90" cy="178" r="4"/><circle cx="90" cy="220" r="4"/><circle cx="90" cy="262" r="4"/><circle cx="455" cy="178" r="4"/>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="17">
    <text x="28" y="168">clk_555</text><text x="28" y="215">reverse</text><text x="28" y="282">forward</text>
    <text x="265" y="91" text-anchor="middle">forward_en_i</text><text x="265" y="326" text-anchor="middle">reverse_en_i</text>
    <text x="279" y="158" text-anchor="middle">not_clk_i</text>
    <text x="700" y="91" text-anchor="middle">cpu0_i</text><text x="840" y="91" text-anchor="middle">cpu_i</text>
    <text x="700" y="221" text-anchor="middle">cpd0_i</text><text x="840" y="221" text-anchor="middle">cpd_i</text>
    <text x="995" y="126">cpu</text><text x="995" y="256">cpd</text>
  </g>
  <g fill="#d9c2f4" stroke="#111" stroke-width="1.5">
    <!-- forward enable AND with reverse input inverted -->
    <path d="M235 100H285 A24 24 0 0 1 285 148H235Z"/>
    <circle cx="230" cy="124" r="4" fill="#fff"/><circle cx="230" cy="112" r="4" fill="#fff"/>
    <!-- reverse enable AND with forward input inverted -->
    <path d="M235 278H285 A24 24 0 0 1 285 326H235Z"/>
    <circle cx="230" cy="302" r="4" fill="#fff"/><circle cx="230" cy="314" r="4" fill="#fff"/>
    <!-- clock inverter -->
    <path d="M255 161L255 195L295 178Z"/><circle cx="301" cy="178" r="5" fill="#fff"/>
    <!-- CPU and CPD AND gates -->
    <path d="M650 96H706 A24 24 0 0 1 706 144H650Z"/>
    <path d="M650 226H706 A24 24 0 0 1 706 274H650Z"/>
    <!-- output inverters -->
    <path d="M815 103L815 137L855 120Z"/><circle cx="861" cy="120" r="5" fill="#fff"/>
    <path d="M815 233L815 267L855 250Z"/><circle cx="861" cy="250" r="5" fill="#fff"/>
  </g>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <text x="225" y="107" text-anchor="end">I0</text><text x="225" y="132" text-anchor="end">I1</text>
    <text x="225" y="296" text-anchor="end">I0</text><text x="225" y="321" text-anchor="end">I1</text>
    <text x="640" y="114" text-anchor="end">I0</text><text x="640" y="139" text-anchor="end">I1</text>
    <text x="640" y="244" text-anchor="end">I0</text><text x="640" y="269" text-anchor="end">I1</text>
    <text x="750" y="115">O</text><text x="750" y="245">O</text>
    <text x="807" y="116" text-anchor="end">I0</text><text x="807" y="246" text-anchor="end">I0</text>
    <text x="875" y="116">O</text><text x="875" y="246">O</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.5">
    <path d="M930 110h20l12 10-12 10h-20z"/><path d="M930 240h20l12 10-12 10h-20z"/>
    <path d="M28 168v20 M28 210v20 M28 252v20"/>
  </g>
</svg>
